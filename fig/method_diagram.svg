<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Two-stage trajectory-replication method</title>
  <desc id="desc">Stage A infers temporal population trajectories from genome-wide variation excluding the tested locus. Stage B estimates per-trajectory allele-frequency slopes, computes directional concordance, discounts relatedness to an effective trajectory count, and runs a GLS meta-analysis. Significance is calibrated by matched control loci and demographic simulation, and compared with the Akbari structure-corrected GLMM.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .box   { fill:#f7f9fc; stroke:#2c3e50; stroke-width:1.5; rx:8; }
      .stage { fill:#e8eef7; stroke:#2c3e50; stroke-width:2; rx:10; }
      .io    { fill:#fff7e6; stroke:#8a6d3b; stroke-width:1.2; rx:6; }
      .cal   { fill:#eaf6ec; stroke:#2e7d32; stroke-width:1.3; rx:8; }
      .alt   { fill:#f3ecf7; stroke:#6a3d9a; stroke-width:1.3; rx:8; }
      .t     { fill:#1a2733; font-size:15px; }
      .ts    { fill:#1a2733; font-size:13px; }
      .th    { fill:#1a2733; font-size:16px; font-weight:bold; }
      .lbl   { fill:#555; font-size:12px; font-style:italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" class="th" font-size="19">Two-stage method: replicated directional change across inferred trajectories</text>

  <!-- Stage A -->
  <rect x="30" y="60" width="440" height="240" class="stage"/>
  <text x="46" y="86" class="th">Stage A — infer temporal trajectories (design)</text>

  <rect x="55" y="100" width="170" height="70" class="io"/>
  <text x="140" y="128" text-anchor="middle" class="ts">Genome-wide genotypes</text>
  <text x="140" y="148" text-anchor="middle" class="ts">+ sample dates</text>
  <text x="140" y="164" text-anchor="middle" class="lbl">tested locus / region excluded</text>

  <rect x="270" y="100" width="175" height="70" class="box"/>
  <text x="357" y="128" text-anchor="middle" class="ts">PCA + time-aware</text>
  <text x="357" y="148" text-anchor="middle" class="ts">clustering</text>

  <line x1="225" y1="135" x2="266" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="205" width="260" height="72" class="io"/>
  <text x="250" y="232" text-anchor="middle" class="ts">Trajectory labels + time support</text>
  <text x="250" y="252" text-anchor="middle" class="ts">and relatedness family map g(t)</text>
  <line x1="357" y1="170" x2="300" y2="201" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="290" width="150" height="0" fill="none"/>

  <!-- Stage B -->
  <rect x="30" y="320" width="600" height="300" class="stage"/>
  <text x="46" y="346" class="th">Stage B — per-trajectory change, concordance, relatedness-discounted meta-analysis</text>

  <rect x="55" y="365" width="150" height="70" class="box"/>
  <text x="130" y="392" text-anchor="middle" class="ts">Per-trajectory</text>
  <text x="130" y="411" text-anchor="middle" class="ts">slope β̂ (Model 1)</text>

  <rect x="245" y="365" width="150" height="70" class="box"/>
  <text x="320" y="392" text-anchor="middle" class="ts">Concordance</text>
  <text x="320" y="411" text-anchor="middle" class="ts">C = max(N₊,N₋)/n</text>

  <rect x="435" y="365" width="165" height="70" class="box"/>
  <text x="517" y="385" text-anchor="middle" class="ts">Family collapse + N_eff</text>
  <text x="517" y="404" text-anchor="middle" class="ts">GLS meta-analysis (Model 2)</text>
  <text x="517" y="423" text-anchor="middle" class="lbl">V = diag(s) R diag(s)</text>

  <line x1="205" y1="400" x2="241" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="395" y1="400" x2="431" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="245" y="470" width="355" height="58" class="box"/>
  <text x="422" y="494" text-anchor="middle" class="ts">Score(ℓ) = |meta_z| × family_concordance</text>
  <text x="422" y="514" text-anchor="middle" class="lbl">a prespecified ranking score, not a likelihood ratio</text>
  <line x1="517" y1="435" x2="470" y2="466" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="435" x2="360" y2="466" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="55" y="470" width="150" height="58" class="box"/>
  <text x="130" y="494" text-anchor="middle" class="ts">Model 0</text>
  <text x="130" y="514" text-anchor="middle" class="lbl">pooled trend (comparison)</text>

  <rect x="55" y="552" width="545" height="52" class="box"/>
  <text x="327" y="574" text-anchor="middle" class="ts">Model 3 (specified, TBD): hierarchical shared mean μ + between-trajectory τ²</text>
  <text x="327" y="594" text-anchor="middle" class="lbl">tasks sim-sweeps / lean-power</text>

  <!-- Calibration column -->
  <rect x="660" y="60" width="290" height="210" class="cal"/>
  <text x="676" y="86" class="th">Null calibration</text>
  <rect x="682" y="102" width="246" height="66" class="io"/>
  <text x="805" y="126" text-anchor="middle" class="ts">Matched control loci</text>
  <text x="805" y="146" text-anchor="middle" class="ts">P = (1 + #≥) / (m + 1)</text>
  <text x="805" y="162" text-anchor="middle" class="lbl">QC-derived, outcome-independent</text>
  <rect x="682" y="182" width="246" height="66" class="io"/>
  <text x="805" y="206" text-anchor="middle" class="ts">Demographic simulation</text>
  <text x="805" y="226" text-anchor="middle" class="ts">turnover vs locus-specific</text>
  <text x="805" y="242" text-anchor="middle" class="lbl">neutral FPR / power (Decision 2,3)</text>

  <rect x="660" y="320" width="290" height="150" class="alt"/>
  <text x="676" y="346" class="th">Comparator</text>
  <rect x="682" y="360" width="246" height="92" class="box"/>
  <text x="805" y="384" text-anchor="middle" class="ts">Akbari et al. GLMM</text>
  <text x="805" y="404" text-anchor="middle" class="ts">logit(p) = β₀ + β_time t + u</text>
  <text x="805" y="424" text-anchor="middle" class="ts">u ~ N(0, τ₁K + τ₂I), LOCO K</text>
  <text x="805" y="443" text-anchor="middle" class="lbl">structure-corrected pooled trend</text>

  <rect x="660" y="490" width="290" height="114" class="alt"/>
  <text x="676" y="516" class="th">Question</text>
  <text x="676" y="540" class="ts">Do loci with low Akbari signal but</text>
  <text x="676" y="560" class="ts">high replication exist (Q3)?</text>
  <text x="676" y="580" class="lbl">Candidate over-correction —</text>
  <text x="676" y="596" class="lbl">tested, not assumed (Decision 5)</text>

  <!-- arrows from score to calibration and comparator -->
  <line x1="600" y1="499" x2="656" y2="200" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="600" y1="499" x2="656" y2="405" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="805" y1="270" x2="805" y2="316" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="490" y="646" text-anchor="middle" class="lbl">Dashed lines: evaluation and comparison; implementation status and equations are in docs/D-method.md and docs/F-reproducible-code.md.</text>
</svg>
