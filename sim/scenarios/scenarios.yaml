# Scenario configurations for demographic simulations

# 1. Neutral drift - no selection, only drift and migration
neutral_drift:
  type: "neutral_drift"
  generations: 100
  migration_rate: 0.01
  seed: 42

# 2. Replacement only - population turnover without selection
replacement_only:
  type: "replacement_only"
  generations: 100
  replacement_generation: 50
  seed: 42

# 3. One population selection - selection in a single population
one_population_selection:
  type: "one_population_selection"
  generations: 100
  selection_strength: 0.1
  selected_population: "pop1"
  selected_loci: [0, 100, 200]  # Loci under selection
  seed: 42

# 4. Shared selection - selection shared across populations
shared_selection:
  type: "shared_selection"
  generations: 100
  selection_strength: 0.1
  selected_loci: [0, 100, 200]
  seed: 42

# 5. Opposing selection - selection in opposite directions
opposing_selection:
  type: "opposing_selection"
  generations: 100
  selection_strength: 0.1
  selected_loci: [0, 100, 200]
  seed: 42

# 6. Selection aligned with turnover - selection in arriving population
selection_aligned_turnover:
  type: "selection_aligned_turnover"
  generations: 100
  selection_strength: 0.1
  selected_loci: [0, 100, 200]
  replacement_generation: 50
  seed: 42